# Nginx: статический сайт Sumchenko Works.
# Положить в /etc/nginx/sites-available/sumchenko и включить симлинком в sites-enabled.
# HTTPS добавит certbot: sudo certbot --nginx -d sumchenko-tech.ru -d www.sumchenko-tech.ru
# Домен ниже поменяйте на купленный.

server {
    listen 80;
    listen [::]:80;
    server_name sumchenko-tech.ru www.sumchenko-tech.ru;

    root /var/www/sumchenko-works;
    index index.html;
    charset utf-8;

    # www → без www
    if ($host = www.sumchenko-tech.ru) {
        return 301 $scheme://sumchenko-tech.ru$request_uri;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Файлы сборки с хешем в имени — кешируются навсегда
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Английская версия со своей страницей 404
    location /en/ {
        try_files $uri $uri/ =404;
        error_page 404 /en/404/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
