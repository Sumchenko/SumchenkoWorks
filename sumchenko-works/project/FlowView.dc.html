<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/colors.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/typography.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/motion.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/base.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/components/sw-components.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/styles.css">
  <script src="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/_ds_bundle.js"></script>
</helmet>
<figure style="margin:0; display:flex; flex-direction:column; gap:28px">
  <div role="group" aria-label="Участники процесса" style="display:flex; flex-wrap:wrap; gap:6px; align-items:center">
    <span class="sw-label" style="margin-right:6px">Участники</span>
    <sc-for list="{{ lanes }}" as="l" hint-placeholder-count="4">
      <x-import component-from-global-scope="SumchenkoWorksDesignSystem_bf1cba.Tag" size="sm" selected="{{ l.selected }}" onClick="{{ l.toggle }}" hint-size="80px,24px">{{ l.label }}</x-import>
    </sc-for>
  </div>
  <ol style="list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:28px var(--grid-gutter); position:relative" style-before="content:''; position:absolute; top:4px; left:0; right:0; border-top:1px dashed var(--fg-3)">
    <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5">
      <li onPointerEnter="{{ s.enter }}" onPointerLeave="{{ leave }}" style="position:relative; display:flex; flex-direction:column; gap:8px; padding-top:24px; opacity:{{ s.opacity }}; transition:opacity 140ms cubic-bezier(.2,.7,.2,1)">
        <span aria-hidden="true" style="position:absolute; top:0; left:0; width:9px; height:9px; background:{{ s.marker }}; border:1px solid var(--fg)"></span>
        <span class="sw-label">{{ s.idx }} · {{ s.lane }}</span>
        <span style="font-size:16px; font-weight:500; line-height:1.3">{{ s.title }}</span>
        <span style="font-size:14px; color:var(--fg-2); line-height:1.5">{{ s.text }}</span>
      </li>
    </sc-for>
  </ol>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:260},&quot;diagram&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;FlowDiagram&quot;}}">
class Component extends DCLogic {
  state = { lane: null, hover: null };
  leave = () => this.setState({ hover: null });
  renderVals() {
    const d = this.props.diagram || { steps: [] };
    const steps0 = d.steps || [];
    const lanesU = [...new Set(steps0.map((s) => s.lane))];
    const active = this.state.hover || this.state.lane;
    const lanes = lanesU.map((l) => ({ label: l, selected: this.state.lane === l, toggle: () => this.setState((st) => ({ lane: st.lane === l ? null : l })) }));
    const steps = steps0.map((s, i) => ({
      idx: String(i + 1).padStart(2, '0'), lane: s.lane, title: s.title, text: s.text,
      opacity: active && active !== s.lane ? 0.35 : 1,
      marker: active === s.lane ? 'var(--fg)' : (active ? 'var(--bg)' : 'var(--fg)'),
      enter: () => this.setState({ hover: s.lane }),
    }));
    return { lanes, steps, leave: this.leave };
  }
}
</script>
</body>
</html>
