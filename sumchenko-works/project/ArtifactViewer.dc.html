<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/colors.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/typography.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/motion.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/base.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/components/sw-components.css">
  <script src="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/_ds_bundle.js"></script>
  <script src="data/content.js"></script>
  <script src="data/store.js"></script>
</helmet>
<div style="display:flex; flex-direction:column; gap:20px">
  <div style="display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; justify-content:space-between">
    <span class="sw-label">{{ a.typeLabel }} · {{ a.metaLine }} · v{{ a.version }} · {{ a.updated }}</span>
    <div style="display:flex; flex-wrap:wrap; gap:6px">
      <sc-if value="{{ canDownload }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="SumchenkoWorksDesignSystem_bf1cba.Button" size="sm" icon-start="download" onClick="{{ download }}" hint-size="150px,32px">{{ downloadLabel }}</x-import>
      </sc-if>
      <sc-if value="{{ isCode }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="SumchenkoWorksDesignSystem_bf1cba.Button" variant="secondary" size="sm" icon-start="copy" onClick="{{ copyCode }}" hint-size="150px,32px">Копировать</x-import>
      </sc-if>
      <sc-if value="{{ isLink }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="SumchenkoWorksDesignSystem_bf1cba.Button" size="sm" href="{{ a.externalHref }}" target="_blank" rel="noopener noreferrer" icon-end="external-link" hint-size="170px,32px">Открыть ресурс</x-import>
      </sc-if>
      <x-import component-from-global-scope="SumchenkoWorksDesignSystem_bf1cba.Button" variant="ghost" size="sm" icon-start="link" onClick="{{ copyLink }}" hint-size="120px,32px">Ссылка</x-import>
    </div>
  </div>
  <p style="font-size:15px; color:var(--fg-2); max-width:64ch">{{ a.summary }}</p>

  <sc-if value="{{ isDoc }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-direction:column; gap:14px; font-size:16px; line-height:1.65; padding:clamp(20px,3vw,36px); background:var(--surface); border:1px solid var(--line)">
      <sc-for list="{{ blocks }}" as="b" hint-placeholder-count="6">
        <sc-if value="{{ b.isH }}" hint-placeholder-val="{{ false }}"><h3 style="font-size:18px; font-weight:500; margin-top:10px">{{ b.text }}</h3></sc-if>
        <sc-if value="{{ b.isP }}" hint-placeholder-val="{{ true }}"><p>{{ b.text }}</p></sc-if>
        <sc-if value="{{ b.isUl }}" hint-placeholder-val="{{ false }}">
          <ul style="margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px">
            <sc-for list="{{ b.items }}" as="it" hint-placeholder-count="3"><li style="display:flex; gap:12px"><span aria-hidden="true" style="flex:none; width:6px; height:6px; margin-top:11px; background:var(--fg)"></span><span>{{ it }}</span></li></sc-for>
          </ul>
        </sc-if>
        <sc-if value="{{ b.isCode }}" hint-placeholder-val="{{ false }}"><pre style="margin:0; padding:16px; background:var(--surface-2); font-size:13px; line-height:1.6; overflow-x:auto; white-space:pre">{{ b.text }}</pre></sc-if>
        <sc-if value="{{ b.isLinks }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; flex-direction:column; border-top:1px solid var(--line); margin-top:8px">
            <span class="sw-label" style="padding:10px 0">Источники</span>
            <sc-for list="{{ b.items }}" as="l" hint-placeholder-count="2">
              <a href="{{ l.href }}" target="_blank" rel="noopener noreferrer" style="display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:15px">{{ l.label }}<span class="sw-mono" style="font-size:12px; color:var(--fg-2)">↗</span></a>
            </sc-for>
          </div>
        </sc-if>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isCode }}" hint-placeholder-val="{{ false }}">
    <figure style="margin:0; border:1px solid var(--line); background:var(--surface)">
      <figcaption style="display:flex; justify-content:space-between; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line)"><span class="sw-label">{{ fileName }}</span><span class="sw-label">{{ lineCount }} строк</span></figcaption>
      <div style="overflow:auto; max-height:56vh">
        <pre style="margin:0; padding:16px 0; font-size:13px; line-height:1.65; min-width:max-content"><sc-for list="{{ codeLines }}" as="ln" hint-placeholder-count="12"><span style="display:grid; grid-template-columns:52px auto"><span aria-hidden="true" style="color:var(--fg-3); text-align:right; padding-right:18px; user-select:none">{{ ln.n }}</span><span style="white-space:pre; padding-right:24px">{{ ln.text }}</span></span></sc-for></pre>
      </div>
    </figure>
  </sc-if>

  <sc-if value="{{ isErd }}" hint-placeholder-val="{{ false }}">
    <div style="padding:clamp(12px,2vw,24px); border:1px solid var(--line)"><dc-import name="ErdView" diagram="{{ diagram }}" hint-size="100%,420px"></dc-import></div>
  </sc-if>
  <sc-if value="{{ isFlow }}" hint-placeholder-val="{{ false }}">
    <div style="padding:clamp(20px,3vw,32px); border:1px solid var(--line); background:var(--surface)"><dc-import name="FlowView" diagram="{{ diagram }}" hint-size="100%,220px"></dc-import></div>
  </sc-if>
  <sc-if value="{{ isComponents }}" hint-placeholder-val="{{ false }}">
    <figure style="margin:0; border:1px solid var(--line); background:var(--surface); padding:40px 16px 24px; position:relative">
      <figcaption class="sw-label" style="position:absolute; top:12px; left:16px">{{ a.code }} — {{ diagramTitle }}</figcaption>
      <x-import component-from-global-scope="SumchenkoWorksDesignSystem_bf1cba.IsoDiagram" nodes="{{ nodes }}" links="{{ links }}" unit="{{ 28 }}" style="max-height:50vh" hint-size="100%,320px"></x-import>
    </figure>
  </sc-if>
  <sc-if value="{{ isImage }}" hint-placeholder-val="{{ false }}">
    <figure style="margin:0; border:1px solid var(--line); background:var(--surface); padding:16px"><img src="{{ a.src }}" alt="{{ a.title }}" style="max-width:100%; max-height:60vh; margin:0 auto; object-fit:contain"></figure>
  </sc-if>
  <sc-if value="{{ isPdf }}" hint-placeholder-val="{{ false }}">
    <iframe src="{{ a.src }}" title="{{ a.title }}" style="width:100%; height:60vh; border:1px solid var(--line); background:var(--surface)"></iframe>
  </sc-if>
  <sc-if value="{{ isLink }}" hint-placeholder-val="{{ false }}">
    <a href="{{ a.externalHref }}" target="_blank" rel="noopener noreferrer" style="display:flex; flex-wrap:wrap; gap:16px 32px; align-items:center; justify-content:space-between; padding:28px; border:1px dashed var(--line-strong); color:var(--fg); text-decoration:none" style-hover="background:var(--surface)">
      <span style="display:flex; flex-direction:column; gap:6px"><span class="sw-label">Внешний ресурс</span><span class="sw-mono" style="font-size:clamp(16px,2vw,20px)">{{ linkHost }}</span></span>
      <x-import component-from-global-scope="SumchenkoWorksDesignSystem_bf1cba.Icon" name="external-link" size="{{ 24 }}" hint-size="24px,24px"></x-import>
    </a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:980,&quot;height&quot;:600},&quot;artifactId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;api-02&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const S = window.SWStore;
    if (!S || S.status !== 'ready') return {};
    const raw = S.artifact(this.props.artifactId);
    if (!raw) return { a: {} };
    const a = S.artifactVM(raw); const d = S.diagram(raw.diagram); const view = raw.view;
    const lines = view === 'code' ? (raw.source || '').split('\n') : [];
    const ext = { code: (raw.format || '').toLowerCase() === 'yaml' ? 'yaml' : 'txt', doc: 'md', erd: 'json', components: 'json', flow: 'json' }[view];
    const fileName = raw.id + (ext ? '.' + ext : '');
    let host = ''; try { host = raw.href ? new URL(raw.href).host : ''; } catch (e) { host = raw.href || ''; }
    return {
      a,
      isDoc: view === 'doc', isCode: view === 'code', isErd: view === 'erd', isFlow: view === 'flow', isComponents: view === 'components', isImage: view === 'image', isPdf: view === 'pdf', isLink: view === 'link',
      canDownload: !!ext, downloadLabel: 'Скачать .' + ext,
      download: () => {
        if (view === 'code') S.download(fileName, raw.source || '', 'text/yaml');
        else if (view === 'doc') S.download(fileName, S.blocksToMd(raw.code + ' ' + raw.title, raw.body), 'text/markdown');
        else if (d) S.download(fileName, JSON.stringify(d, null, 2), 'application/json');
      },
      copyCode: () => S.copy(raw.source || '', 'Код скопирован'),
      copyLink: () => S.copy(location.href, 'Ссылка скопирована'),
      blocks: S.blocks(raw.body),
      codeLines: lines.map((t, k) => ({ n: k + 1, text: t || ' ' })), lineCount: lines.length, fileName,
      diagram: d, diagramTitle: d ? d.title : '',
      nodes: d && d.nodes ? d.nodes : [], links: d && d.links ? d.links : [],
      linkHost: host,
    };
  }
}
</script>
</body>
</html>
