<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/colors.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/typography.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/motion.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/tokens/base.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/components/sw-components.css">
  <link rel="stylesheet" href="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/styles.css">
  <script src="_ds/sumchenko-works-design-system-bf1cba9a-6b4a-4fa3-b750-c4ddc505709d/_ds_bundle.js"></script>
</helmet>
<a href="{{ artifact.href }}" style="display:flex; flex-wrap:wrap; align-items:center; gap:12px 24px; padding:16px 12px; border-bottom:1px solid var(--line); color:var(--fg); text-decoration:none; transition:background-color 140ms cubic-bezier(.2,.7,.2,1)" style-hover="background:var(--surface)">
  <div style="flex:1 1 320px; display:flex; align-items:center; gap:16px; min-width:0">
    <span aria-hidden="true" style="width:40px; height:40px; flex:none; display:grid; place-items:center; border:1px solid var(--line)">
      <x-import component-from-global-scope="SumchenkoWorksDesignSystem_bf1cba.Icon" name="{{ artifact.icon }}" size="{{ 24 }}" hint-size="24px,24px"></x-import>
    </span>
    <div style="display:flex; flex-direction:column; gap:2px; min-width:0">
      <span class="sw-label">{{ artifact.code }} · {{ artifact.typeLabel }}</span>
      <span style="font-size:16px; line-height:1.35">{{ artifact.title }}</span>
    </div>
  </div>
  <div style="flex:0 1 auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px 24px; margin-left:56px">
    <span class="sw-label" style="min-width:64px">{{ artifact.projectCode }}</span>
    <span class="sw-label" style="min-width:140px">{{ artifact.metaLine }}</span>
    <span aria-hidden="true" style="width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--line-strong)">
      <x-import component-from-global-scope="SumchenkoWorksDesignSystem_bf1cba.Icon" name="arrow-right" size="{{ 16 }}" hint-size="16px,16px"></x-import>
    </span>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:90},&quot;artifact&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ArtifactVM&quot;}}"></script>
</body>
</html>
