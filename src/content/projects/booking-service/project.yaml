code: P—01
order: 4
demo: true
featured: true
title: { ru: "Сервис онлайн-записи", en: "Online booking service" }
summary:
  ru: Онлайн-запись с расписанием специалистов, напоминаниями и оплатой.
  en: Online booking with specialist schedules, reminders and payment.
category: dev
status: live
year: 2026
period: 2025.12 → 2026.03
role: { ru: "Разработка, анализ", en: "Development, analysis" }
tech: [typescript, react, nodejs, postgres, openapi]
cover: d-book-c4
links: { demo: null, repo: null, docs: artifacts }

problem:
  ru: Запись велась вручную, слоты пересекались, около пятой части клиентов не приходили.
  en: Bookings were handled manually, slots overlapped and about a fifth of clients did not show up.
overview:
  ru: Небольшой сервис для студии — клиенты записываются онлайн, специалисты управляют расписанием, предоплата снижает число неявок.
  en: A small service for a studio — clients book online, specialists manage their schedules, prepayment reduces no-shows.
purpose:
  ru: Заменить запись по телефону и таблицу расписания.
  en: Replace phone bookings and the schedule spreadsheet.
goals:
  - { ru: "Запись без звонка", en: "Booking without a phone call" }
  - { ru: "Исключить пересечение слотов", en: "No overlapping slots" }
  - { ru: "Снизить число неявок", en: "Fewer no-shows" }
requirements:
  - { id: FR-01, type: FR, priority: Must, text: { ru: "Клиент видит только свободные слоты нужной длительности.", en: "The client sees only free slots of the required length." } }
  - { id: FR-02, type: FR, priority: Must, text: { ru: "Слот удерживается 10 минут на время оплаты.", en: "A slot is held for 10 minutes during payment." } }
  - { id: FR-03, type: FR, priority: Should, text: { ru: "Напоминания за 24 и 2 часа.", en: "Reminders 24 and 2 hours before." } }
  - { id: NFR-01, type: NFR, priority: Must, text: { ru: "Корректная работа с часовыми поясами специалистов.", en: "Correct handling of specialists' time zones." } }
features:
  - { ru: "Онлайн-запись", en: "Online booking" }
  - { ru: "Расписание специалиста", en: "Specialist schedule" }
  - { ru: "Предоплата", en: "Prepayment" }
  - { ru: "Напоминания", en: "Reminders" }
scenarios:
  - title: { ru: "Запись клиента", en: "Client booking" }
    actor: { ru: "Клиент", en: "Client" }
    steps:
      - { ru: "Выбирает услугу и специалиста", en: "Picks a service and a specialist" }
      - { ru: "Выбирает свободный слот", en: "Picks a free slot" }
      - { ru: "Вносит предоплату", en: "Pays the deposit" }
      - { ru: "Получает подтверждение", en: "Gets a confirmation" }
stages:
  - period: '2025.12'
    title: { ru: "Требования", en: "Requirements" }
    text: { ru: "Сценарии записи и отмены, модель данных.", en: "Booking and cancellation scenarios, data model." }
  - period: '2026.01'
    title: MVP
    text: { ru: "Запись и расписание без оплаты.", en: "Booking and schedule without payment." }
  - period: '2026.03'
    title: { ru: "Оплата и напоминания", en: "Payment and reminders" }
    text: { ru: "Предоплата и уведомления.", en: "Prepayment and notifications." }
results:
  text: { ru: 'Пример: запись полностью онлайн, пересечения слотов исключены.', en: 'Example: booking is fully online, overlapping slots are impossible.' }
  state: { ru: 'Пример: в эксплуатации.', en: 'Example: in production.' }

architecture:
  diagram: d-book-c4
  text:
    ru: 'Один API-сервис: для текущего объёма отдельные сервисы не оправданы.'
    en: 'A single API service: separate services are not justified at the current scale.'
  flows: [d-book-flow]
dataModel:
  diagram: d-book-erd
  text:
    ru: Пересечение слотов исключается ограничением в базе, а не только проверкой в коде.
    en: Overlapping slots are prevented by a database constraint, not just a check in code.
api:
  endpoints:
    - { method: GET, path: /v1/slots, text: { ru: "Свободные слоты по услуге и дате", en: "Free slots by service and date" } }
    - { method: POST, path: /v1/bookings, text: { ru: "Создать бронь и удержать слот", en: "Create a booking and hold the slot" } }
    - { method: POST, path: '/v1/bookings/{id}/cancel', text: { ru: "Отменить бронь", en: "Cancel a booking" } }
  integrations:
    - name: { ru: "Платёжный провайдер", en: "Payment provider" }
      protocol: REST + webhook
      text: { ru: "Подтверждение предоплаты.", en: "Prepayment confirmation." }
decisions:
  - title: { ru: "Exclusion constraint в PostgreSQL", en: "Exclusion constraint in PostgreSQL" }
    choice: { ru: "Ограничение на пересечение интервалов.", en: "A constraint on overlapping intervals." }
    why: { ru: "Гарантия на уровне данных при конкурентных запросах.", en: "A data-level guarantee under concurrent requests." }
    alternatives: { ru: "Блокировки в приложении — сложнее и ненадёжнее.", en: "Application-level locks — more complex and less reliable." }
related: [payment-gateway]

diagrams:
  - id: d-book-c4
    kind: components
    title: { ru: "Компоненты сервиса записи", en: "Booking service components" }
    nodes:
      - { id: web, label: WEB, sub: react, x: 0, y: 0, w: 2, d: 2, h: 0.5 }
      - { id: api, label: API, sub: node.js, x: 4, y: 0, w: 2, d: 2, h: 1.5 }
      - { id: notify, label: NOTIFY, sub: email · sms, x: 8, y: 0, w: 2, d: 1, h: 0.5 }
      - { id: db, label: DB, sub: postgres, x: 4, y: 4, w: 2, d: 2, h: 1 }
      - { id: psp, label: PSP, sub: { ru: "внешний", en: "external" }, x: 8, y: 3, w: 2, d: 2, h: 1 }
    links: [[web, api], [api, db], [api, notify], [api, psp]]
    notes:
      web: { ru: "Клиентская запись и кабинет специалиста.", en: "Client booking and the specialist dashboard." }
      api: { ru: "Расписание, бронирования, оплата. Один сервис.", en: "Schedule, bookings, payment. One service." }
      notify: { ru: "Напоминания за 24 и 2 часа.", en: "Reminders 24 and 2 hours before." }
      db: { ru: "Слоты и брони с ограничением на пересечение.", en: "Slots and bookings with an overlap constraint." }
      psp: { ru: "Предоплата через внешнего провайдера.", en: "Prepayment via an external provider." }
  - id: d-book-erd
    kind: erd
    title: { ru: "Модель данных записи", en: "Booking data model" }
    entities:
      - { id: specialist, name: SPECIALIST, fields: [[id, uuid, PK], [name, text], [timezone, text]] }
      - { id: service, name: SERVICE, fields: [[id, uuid, PK], [title, text], [duration_min, int], [price, numeric]] }
      - { id: slot, name: SLOT, fields: [[id, uuid, PK], [specialist_id, uuid, FK], [starts_at, timestamptz], [ends_at, timestamptz]] }
      - { id: booking, name: BOOKING, fields: [[id, uuid, PK], [slot_id, uuid, FK], [client_id, uuid, FK], [service_id, uuid, FK], [status, enum]] }
      - { id: client, name: CLIENT, fields: [[id, uuid, PK], [phone, text, UK], [name, text]] }
    relations: [[specialist, slot, '1 : N'], [slot, booking, '1 : 0..1'], [client, booking, '1 : N'], [service, booking, '1 : N']]
  - id: d-book-flow
    kind: flow
    title: { ru: "Сценарий записи", en: "Booking scenario" }
    steps:
      - { lane: CLIENT, title: { ru: "Выбор услуги", en: "Service choice" }, text: { ru: "Услуга, специалист, дата.", en: "Service, specialist, date." } }
      - { lane: API, title: { ru: "Свободные слоты", en: "Free slots" }, text: { ru: "С учётом длительности и часового пояса.", en: "Accounting for duration and time zone." } }
      - { lane: API, title: { ru: "Удержание слота", en: "Slot hold" }, text: { ru: "10 минут на оплату.", en: "10 minutes to pay." } }
      - { lane: PSP, title: { ru: "Предоплата", en: "Prepayment" }, text: { ru: "Webhook подтверждает оплату.", en: "A webhook confirms the payment." } }
      - { lane: NOTIFY, title: { ru: "Подтверждение", en: "Confirmation" }, text: { ru: "Сообщение и напоминания.", en: "A message and reminders." } }

artifacts:
  - id: srs-01
    code: SRS-01
    type: srs
    view: doc
    version: '1.0'
    updated: '2025.12'
    title: { ru: "Требования к сервису записи", en: "Booking service requirements" }
    summary: { ru: "Сценарии записи, отмены и напоминаний.", en: "Booking, cancellation and reminder scenarios." }
  - id: erd-01
    code: ERD-01
    type: erd
    view: erd
    diagram: d-book-erd
    version: '1.0'
    updated: '2026.01'
    title: { ru: "Модель данных записи", en: "Booking data model" }
    summary: { ru: "Специалисты, услуги, слоты, брони и клиенты.", en: "Specialists, services, slots, bookings and clients." }
  - id: api-01
    code: API-01
    type: openapi
    view: code
    file: booking-v1.yaml
    version: 0.9.0
    updated: '2026.01'
    title: 'OpenAPI: booking v1'
    summary: { ru: "Слоты и бронирования.", en: "Slots and bookings." }
