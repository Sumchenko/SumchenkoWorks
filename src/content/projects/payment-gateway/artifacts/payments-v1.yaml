openapi: 3.1.0
info:
  title: Payments API (demo)
  version: 1.0.0
paths:
  /v1/payments:
    post:
      summary: Create a payment
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreate' }
      responses:
        '201': { description: Payment created }
        '409': { description: Key reused with a different body }
  /v1/payments/{id}/refunds:
    post:
      summary: Create a refund
      responses:
        '201': { description: Refund created }
components:
  schemas:
    PaymentCreate:
      type: object
      required: [amount, currency, merchant_id]
      properties:
        amount: { type: string, example: '1490.00' }
        currency: { type: string, example: RUB }
        merchant_id: { type: string, format: uuid }
