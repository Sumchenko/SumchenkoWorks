# Демонстрационный проект. Имя папки = адрес страницы: /works/payment-gateway/
code: P—03
order: 1
demo: true
featured: true
title: { ru: "Платёжный шлюз", en: "Payment gateway" }
summary:
  ru: Единая точка приёма платежей для трёх продуктов — маршрутизация, идемпотентность, сверка.
  en: A single payment entry point for three products — routing, idempotency, reconciliation.
category: sa
status: live
year: 2025
period: 2025.03 → 2025.11
role: { ru: "Системный анализ, архитектура", en: "Systems analysis, architecture" }
tech: [go, kafka, postgres, redis, openapi, c4]
cover: d-pay-c4
links: { demo: null, repo: null, docs: artifacts }

problem:
  ru: Каждый продукт интегрировался с провайдерами самостоятельно. Повторные запросы приводили к двойным списаниям, а сверка выполнялась вручную по выгрузкам.
  en: Each product integrated with payment providers on its own. Retried requests caused double charges, and reconciliation was done by hand from exports.
overview:
  ru: Шлюз принимает платежи от веб-, мобильного и кассового продуктов через один контракт и маршрутизирует их между несколькими провайдерами.
  en: The gateway accepts payments from the web, mobile and POS products through one contract and routes them across several providers.
purpose:
  ru: Убрать дублирование платёжной логики в продуктах и дать финансовой команде единый реестр операций.
  en: Remove duplicated payment logic from the products and give the finance team a single ledger of operations.
goals:
  - { ru: "Один API для всех продуктов", en: "One API for all products" }
  - { ru: "Нулевые двойные списания при повторах", en: "Zero double charges on retries" }
  - { ru: "Автоматическая ежедневная сверка", en: "Automatic daily reconciliation" }
  - { ru: "Подключение нового провайдера без изменений в продуктах", en: "New providers without changes in the products" }
requirements:
  - { id: FR-01, type: FR, priority: Must, text: { ru: "Приём платежа с обязательным ключом идемпотентности.", en: "Accept a payment with a mandatory idempotency key." } }
  - { id: FR-02, type: FR, priority: Must, text: { ru: "Полный и частичный возврат.", en: "Full and partial refunds." } }
  - { id: FR-03, type: FR, priority: Should, text: { ru: "Выбор провайдера по правилам маршрутизации.", en: "Provider selection by routing rules." } }
  - { id: NFR-01, type: NFR, priority: Must, text: { ru: "p95 ответа API ≤ 300 мс без учёта провайдера.", en: "API p95 latency ≤ 300 ms excluding the provider." } }
  - { id: NFR-02, type: NFR, priority: Must, text: { ru: "Доступность 99.9% в месяц.", en: "99.9% monthly availability." } }
  - { id: NFR-03, type: NFR, priority: Should, text: { ru: "Хранение журнала операций 5 лет.", en: "Operation log retained for 5 years." } }
features:
  - { ru: "Идемпотентный приём платежей", en: "Idempotent payment intake" }
  - { ru: "Маршрутизация между провайдерами", en: "Routing across providers" }
  - { ru: "Возвраты и сторно", en: "Refunds and reversals" }
  - { ru: "Журнал событий для потребителей", en: "Event log for consumers" }
  - { ru: "Ежедневная сверка", en: "Daily reconciliation" }
scenarios:
  - title: { ru: "Оплата заказа", en: "Order payment" }
    actor: { ru: "Покупатель", en: "Customer" }
    steps:
      - { ru: "Продукт отправляет платёж с ключом", en: "The product sends a payment with a key" }
      - { ru: "Шлюз выбирает провайдера", en: "The gateway picks a provider" }
      - { ru: "Провайдер авторизует платёж", en: "The provider authorises the payment" }
      - { ru: "Продукт получает событие о статусе", en: "The product receives a status event" }
  - title: { ru: "Возврат", en: "Refund" }
    actor: { ru: "Мерчант", en: "Merchant" }
    steps:
      - { ru: "Мерчант запрашивает возврат", en: "The merchant requests a refund" }
      - { ru: "Шлюз проверяет остаток", en: "The gateway checks the remaining amount" }
      - { ru: "Провайдер подтверждает возврат", en: "The provider confirms the refund" }
      - { ru: "В реестре появляется сторно-проводка", en: "A reversal entry appears in the ledger" }
stages:
  - period: '2025.03'
    title: { ru: "Исследование", en: "Research" }
    text: { ru: "Интервью с командами продуктов, разбор инцидентов.", en: "Interviews with product teams, incident review." }
  - period: '2025.05'
    title: { ru: "Модель и контракты", en: "Model and contracts" }
    text: { ru: "ERD, OpenAPI, ADR по идемпотентности.", en: "ERD, OpenAPI, an ADR on idempotency." }
  - period: '2025.07'
    title: { ru: "Реализация", en: "Implementation" }
    text: { ru: "Два провайдера, миграция первого продукта.", en: "Two providers, first product migrated." }
  - period: '2025.11'
    title: { ru: "Сверка и запуск", en: "Reconciliation and launch" }
    text: { ru: "Автоматическая сверка, все продукты на шлюзе.", en: "Automatic reconciliation, all products on the gateway." }
challenges:
  - title: { ru: "Разные модели статусов у провайдеров", en: "Different status models across providers" }
    text: { ru: "Свели к единому конечному автомату с явными переходами.", en: "Unified into one state machine with explicit transitions." }
  - title: { ru: "Миграция без простоя", en: "Zero-downtime migration" }
    text: { ru: "Двойная запись на период переключения продуктов.", en: "Dual writes while the products were switched over." }
results:
  text:
    ru: В демонстрационном сценарии все продукты работают через один контракт, сверка формируется автоматически.
    en: In the demo scenario all products work through one contract and reconciliation is produced automatically.
  state:
    ru: 'Пример: сопровождение, новые провайдеры подключаются через адаптеры.'
    en: 'Example: in maintenance, new providers are added via adapters.'

architecture:
  diagram: d-pay-c4
  text:
    ru: Синхронный контур отвечает продукту, асинхронный — распространяет изменения статусов через события.
    en: The synchronous path answers the product; the asynchronous one distributes status changes as events.
  flows: [d-pay-flow, d-refund-flow]
dataModel:
  diagram: d-pay-erd
  text:
    ru: Платёж — агрегат; попытки, возвраты и проводки ссылаются на него и никогда не изменяются задним числом.
    en: A payment is the aggregate; attempts, refunds and ledger entries reference it and are never changed retroactively.
api:
  endpoints:
    - { method: POST, path: /v1/payments, text: { ru: "Создать платёж (Idempotency-Key обязателен)", en: "Create a payment (Idempotency-Key required)" } }
    - { method: GET, path: '/v1/payments/{id}', text: { ru: "Статус и история попыток", en: "Status and attempt history" } }
    - { method: POST, path: '/v1/payments/{id}/refunds', text: { ru: "Создать возврат", en: "Create a refund" } }
    - { method: GET, path: '/v1/reconciliation/{date}', text: { ru: "Результат сверки за день", en: "Reconciliation result for a day" } }
  integrations:
    - name: { ru: "Провайдеры эквайринга", en: "Acquiring providers" }
      protocol: REST + webhooks
      text: { ru: "Адаптер на каждого провайдера с общим интерфейсом.", en: "One adapter per provider behind a common interface." }
    - name: { ru: "Продукты-потребители", en: "Consumer products" }
      protocol: Kafka
      text: { ru: "Топик payment.status, схема в реестре схем.", en: "Topic payment.status, schema in the schema registry." }
    - name: GATEWAY → ROUTER
      protocol: gRPC
      text: { ru: "Синхронный вызов с таймаутом 2 с.", en: "Synchronous call with a 2 s timeout." }
    - name: ROUTER → PROVIDER
      protocol: REST
      text: { ru: "Адаптер на провайдера.", en: "Per-provider adapter." }
    - name: GATEWAY → EVENTS
      protocol: Kafka
      text: { ru: "Outbox-таблица гарантирует публикацию.", en: "An outbox table guarantees publishing." }
decisions:
  - title: { ru: "Идемпотентность на уровне шлюза", en: "Idempotency at the gateway" }
    choice: { ru: "Ключ в заголовке, ответ кешируется 24 часа.", en: "Key in a header, response cached for 24 hours." }
    why: { ru: "Повторы — норма для мобильных сетей; продукты не должны решать это сами.", en: "Retries are normal on mobile networks; products should not deal with it themselves." }
    alternatives: { ru: "Дедупликация у провайдера — поддерживается не всеми.", en: "Deduplication at the provider — not supported by all of them." }
  - title: { ru: "Статусы через события", en: "Statuses via events" }
    choice: { ru: "Kafka-топик вместо опроса API.", en: "A Kafka topic instead of API polling." }
    why: { ru: "Потребители независимы и не нагружают шлюз.", en: "Consumers are independent and do not load the gateway." }
    alternatives: { ru: "Webhooks в продукты — сложнее гарантировать доставку.", en: "Webhooks to products — delivery is harder to guarantee." }
  - title: { ru: "Outbox вместо прямой публикации", en: "Outbox instead of direct publishing" }
    pros:
      - { ru: "Событие не теряется при сбое брокера", en: "No lost events if the broker fails" }
      - { ru: "Атомарно с записью в БД", en: "Atomic with the database write" }
    cons:
      - { ru: "Задержка до секунды", en: "Up to a second of delay" }
      - { ru: "Ещё один фоновый процесс", en: "One more background process" }
  - title: { ru: "Один ROUTER на всех провайдеров", en: "One ROUTER for all providers" }
    pros:
      - { ru: "Единые правила маршрутизации", en: "Single set of routing rules" }
    cons:
      - { ru: "Общая точка отказа — нужны три реплики", en: "Shared point of failure — needs three replicas" }
related: [booking-service, crm-smb]

diagrams:
  - id: d-pay-c4
    kind: components
    title: { ru: "Компоненты платёжного шлюза", en: "Payment gateway components" }
    nodes:
      - { id: client, label: CLIENTS, sub: web · mobile · pos, x: 0, y: 0, w: 2, d: 2, h: 0.5 }
      - { id: gw, label: GATEWAY, sub: auth · idempotency, x: 4, y: 0, w: 2, d: 2, h: 1 }
      - { id: svc, label: ROUTER, sub: 3 × go, x: 8, y: 0, w: 2, d: 2, h: 2 }
      - { id: queue, label: EVENTS, sub: kafka, x: 4, y: 4, w: 2, d: 1, h: 0.5 }
      - { id: db, label: LEDGER, sub: postgres, x: 8, y: 4, w: 2, d: 2, h: 1.5 }
    links: [[client, gw], [gw, svc], [gw, queue], [queue, db], [svc, db]]
    notes:
      client: { ru: "Три продукта с разными SDK приходят в один контракт.", en: "Three products with different SDKs converge on one contract." }
      gw: { ru: "Ключ идемпотентности на каждый запрос, лимиты по мерчанту.", en: "An idempotency key per request, per-merchant limits." }
      svc: { ru: "Выбор провайдера по стоимости и доступности.", en: "Provider selection by cost and availability." }
      queue: { ru: "Все изменения статусов — события; потребители независимы.", en: "Every status change is an event; consumers are independent." }
      db: { ru: "Двойная запись и ежедневная сверка с провайдерами.", en: "Double-entry bookkeeping and daily reconciliation with providers." }
  - id: d-pay-erd
    kind: erd
    title: { ru: "Модель данных реестра платежей", en: "Payment ledger data model" }
    entities:
      - { id: merchant, name: MERCHANT, fields: [[id, uuid, PK], [name, text], [daily_limit, numeric], [created_at, timestamptz]] }
      - { id: payment, name: PAYMENT, fields: [[id, uuid, PK], [merchant_id, uuid, FK], [idempotency_key, text, UK], [amount, numeric], [currency, char(3)], [status, enum]] }
      - { id: attempt, name: ATTEMPT, fields: [[id, uuid, PK], [payment_id, uuid, FK], [provider_id, uuid, FK], [status, enum], [latency_ms, int]] }
      - { id: provider, name: PROVIDER, fields: [[id, uuid, PK], [code, text, UK], [fee_pct, numeric], [enabled, bool]] }
      - { id: refund, name: REFUND, fields: [[id, uuid, PK], [payment_id, uuid, FK], [amount, numeric], [reason, text], [status, enum]] }
      - { id: ledger, name: LEDGER_ENTRY, fields: [[id, bigint, PK], [payment_id, uuid, FK], [account, text], [debit, numeric], [credit, numeric], [posted_at, timestamptz]] }
    relations: [[merchant, payment, '1 : N'], [payment, attempt, '1 : N'], [provider, attempt, '1 : N'], [payment, refund, '1 : N'], [payment, ledger, '1 : N']]
  - id: d-pay-flow
    kind: flow
    title: { ru: "Поток платежа", en: "Payment flow" }
    steps:
      - { lane: CLIENT, title: { ru: "Запрос оплаты", en: "Payment request" }, text: { ru: "POST /payments с Idempotency-Key.", en: "POST /payments with an Idempotency-Key." } }
      - { lane: GATEWAY, title: { ru: "Проверка ключа", en: "Key check" }, text: { ru: "Повтор возвращает сохранённый ответ.", en: "A retry returns the stored response." } }
      - { lane: ROUTER, title: { ru: "Выбор провайдера", en: "Provider selection" }, text: { ru: "Стоимость, доступность, лимиты.", en: "Cost, availability, limits." } }
      - { lane: PROVIDER, title: { ru: "Авторизация", en: "Authorisation" }, text: { ru: "Синхронный ответ или webhook.", en: "Synchronous response or a webhook." } }
      - { lane: EVENTS, title: payment.status, text: { ru: "Событие для всех потребителей.", en: "An event for all consumers." } }
      - { lane: LEDGER, title: { ru: "Проводка", en: "Posting" }, text: { ru: "Двойная запись, сверка раз в сутки.", en: "Double entry, reconciled daily." } }
  - id: d-refund-flow
    kind: flow
    title: { ru: "Сценарий возврата", en: "Refund scenario" }
    steps:
      - { lane: MERCHANT, title: { ru: "Запрос возврата", en: "Refund request" }, text: { ru: "Полный или частичный, с причиной.", en: "Full or partial, with a reason." } }
      - { lane: GATEWAY, title: { ru: "Валидация", en: "Validation" }, text: { ru: "Сумма не больше остатка платежа.", en: "Amount not above the payment remainder." } }
      - { lane: ROUTER, title: { ru: "Возврат у провайдера", en: "Refund at the provider" }, text: { ru: "Через того же провайдера, что и оплата.", en: "Through the same provider as the payment." } }
      - { lane: LEDGER, title: { ru: "Сторно-проводка", en: "Reversal entry" }, text: { ru: "Отдельная запись, исходная не меняется.", en: "A separate entry; the original is untouched." } }
      - { lane: EVENTS, title: refund.completed, text: { ru: "Уведомление мерчанта.", en: "Merchant notification." } }

