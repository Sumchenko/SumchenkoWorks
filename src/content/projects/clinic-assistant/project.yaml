# Голосовой ассистент регистратуры — источник: приватный репозиторий хакатона «Точка сборки» 2026 (Gitea, team-047)
# и локальная рабочая копия VibeCoding/Сlinic assistant. Ссылку на код добавить после публикации на GitHub.
