title: { ru: "Голосовой ассистент регистратуры", en: "Clinic reception voice assistant" }
summary:
  ru: "Хакатон «Точка сборки» 2026: ассистент отвечает на звонки поликлиники — записывает к врачу, обзванивает с напоминаниями и передаёт сложное регистратору. Команда из двух человек, моя зона — бэкенд и телефония."
  en: A hackathon project ("Tochka Sborki" 2026) — a voice assistant that answers a polyclinic's calls, books appointments, makes reminder calls and hands complex cases to a human registrar. A team of two; my zone was the backend and telephony.
