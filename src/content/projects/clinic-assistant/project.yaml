      pg: { ru: "Postgres 16: расписание и слоты, записи, обзвон, переводы, лист ожидания, реестр звонков.", en: "Postgres 16: the schedule and slots, visits, robocalls, transfers, the waiting list, the call registry." }
      mis: { ru: "Стенд «Регистратура» — мок МИС организаторов: клиенты, записи, заявки; лимит 10 запросов/мин.", en: "The Reception stand — the organisers' HIS mock: clients, visits, requests; a 10-requests-per-minute limit." }
      panel: { ru: "Панель регистратора и пульт тестирования — Jinja2-страницы бэкенда, без SPA.", en: "The registrar panel and the testing console — the backend's Jinja2 pages, no SPA." }
  - id: d-ca-call
    kind: flow
    title: { ru: "Входящий звонок: от речи до записи", en: "An inbound call: from speech to a booking" }
    steps:
      - { lane: { ru: "ПАЦИЕНТ", en: "PATIENT" }, title: { ru: "Звонит на 047", en: "Calls 047" }, text: { ru: "Софтфон → SIP-шлюз → Asterisk; диалплан создаёт call_id.", en: "Softphone → SIP gateway → Asterisk; the dialplan mints a call_id." } }
      - { lane: ASTERISK, title: { ru: "Голос в агента", en: "Audio into the agent" }, text: { ru: "AudioSocket, TCP, 8 кГц; падение агента — запасной путь на регистратора.", en: "AudioSocket, TCP, 8 kHz; if the agent is down, a fallback route to a registrar." } }
      - { lane: AGENT, title: { ru: "Речь в текст", en: "Speech to text" }, text: { ru: "Silero VAD находит реплику, GigaAM распознаёт локально (~0,2 с).", en: "Silero VAD finds the utterance, GigaAM recognises it locally (~0.2 s)." } }
      - { lane: AGENT, title: { ru: "Красные флаги до LLM", en: "Red flags before the LLM" }, text: { ru: "Код по леммам; категория А — 103/112 и перевод, сценарий прерван.", en: "Code over lemmas; category A — 103/112 and a transfer, the scenario is aborted." } }
      - { lane: LLM, title: { ru: "Понять реплику", en: "Understand the utterance" }, text: { ru: "Function calling, только функции текущего шага автомата.", en: "Function calling, only the current step's functions." } }
      - { lane: BACKEND, title: { ru: "Слот и запись", en: "Slot and booking" }, text: { ru: "Резерв слота локально, затем создание в стенде; таймаут 5 с.", en: "Reserve the slot locally, then create it in the stand; a 5-second timeout." } }
      - { lane: MIS STAND, title: { ru: "Запись создана", en: "Visit created" }, text: { ru: "Только теперь ассистент говорит «вы записаны» — с датой и кабинетом.", en: "Only now does the assistant say \"you are booked\" — with the date and room." } }
  - id: d-ca-outbound
    kind: flow
    title: { ru: "Обзвон: напоминание и лист ожидания", en: "Robocalls: reminders and the waiting list" }
    steps:
      - { lane: BACKEND, title: { ru: "Накануне визита", en: "The day before" }, text: { ru: "По записи создаётся звонок-напоминание (С-10); без телефона — только SMS.", en: "A reminder call is created per visit (С-10); without a phone — SMS only." } }
      - { lane: BACKEND, title: { ru: "Originate через ARI", en: "Originate via ARI" }, text: { ru: "Исходящий канал в Asterisk; call_id создаёт бэкенд, не диалплан.", en: "An outbound channel in Asterisk; the call_id comes from the backend, not the dialplan." } }
      - { lane: AGENT, title: { ru: "Диалог по сценарию", en: "The scripted dialogue" }, text: { ru: "С-10: подтвердить, перенести или отменить; С-11 — предложить освободившийся слот.", en: "С-10: confirm, reschedule or cancel; С-11 — offer a freed slot." } }
      - { lane: { ru: "ПАЦИЕНТ", en: "PATIENT" }, title: { ru: "Отвечает", en: "Answers" }, text: { ru: "Слот листа ожидания держится за ним 15 минут; после двух отказов звонит регистратор.", en: "A waiting-list slot is held for them for 15 minutes; after two refusals a registrar calls." } }
      - { lane: BACKEND, title: { ru: "Итог", en: "The outcome" }, text: { ru: "Не дозвонились за 2 попытки — SMS-журнал; результат — в реестр звонков.", en: "Two failed attempts — the SMS log; the result goes into the call registry." } }
  - id: d-ca-erd
    kind: erd
    title: { ru: "Модель данных", en: "Data model" }
    entities:
      - { id: doctors, name: DOCTORS, fields: [[code, varchar, PK], [specialty, varchar, FK], [department, varchar], [is_active, bool]] }
      - { id: slots, name: SLOTS, fields: [[id, varchar, PK], [doctor_code, varchar, FK], [start, datetime], [end, datetime], [excel_status, varchar]] }
      - { id: visits, name: VISITS, fields: [[id, serial, PK], [stand_visit_id, int, UK], [patient_id, int], [slot_id, varchar], [status, enum], [confirmed, bool]] }
      - { id: patients, name: PATIENTS, fields: [[stand_client_id, int, PK], [phone, varchar], [reminder_calls, bool], [reminder_sms, bool]] }
      - { id: calls, name: CALLS, fields: [[call_id, varchar, PK], [direction, enum], [ani, varchar], [result_code, varchar], [transferred, bool], [transcript_masked, json]] }
      - { id: transfers, name: TRANSFERS, fields: [[id, serial, PK], [call_id, varchar, FK], [rule, varchar], [priority, varchar], [status, varchar], [justified, 'bool?']] }
      - { id: reminders, name: REMINDERS, fields: [[id, serial, PK], [visit_id, int, FK], [status, varchar], [attempt, int], [next_at, datetime], [sms_sent, bool]] }
    relations: [[doctors, slots, '1 : N'], [slots, visits, '1 : 0..1'], [patients, visits, '1 : N'], [visits, reminders, '1 : N'], [calls, transfers, '1 : N']]

