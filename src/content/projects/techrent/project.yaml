# ТехРент — источник: репозиторий github.com/Sumchenko/techrent (SUMMARY.md, CLAUDE.md, sa-docs/, миграции и код).
code: P—02
order: 2
demo: false
featured: true
title: { ru: "ТехРент", en: "TechRent" }
summary:
  ru: CRM для аренды спецтехники — бронирование с проверкой доступности, календарь парка, платежи, права менеджеров и журнал действий.
  en: A CRM for construction equipment rental — booking with availability checks, a fleet calendar, payments, manager permissions and an audit log.
category: sa
status: live
year: 2026
period: '2026.06 → 2026.10'
role:
  ru: Аналитика, проектирование, разработка в Claude Code (дипломный проект)
  en: Analysis, design, development with Claude Code (graduation project)
tech: [go, postgres, react, typescript, zustand, docker, nginx, openapi, bpmn]
cover: d-tr-components
links:
  repo: https://github.com/Sumchenko/techrent
  docs: artifacts

problem:
  ru: У небольших компаний есть своя техника — экскаваторы, краны, самосвалы, — и часть времени она простаивает. Сдавать её выгодно, но аренду ведут в таблицах и на бумаге. Одну машину легко пообещать двум клиентам или отдать технику из ремонта, а кто сколько должен, приходится выяснять вручную. Тяжёлая учётная система для этого слишком дорога и долга во внедрении.
  en: Small companies own equipment — excavators, cranes, dump trucks — and part of the time it sits idle. Renting it out pays, but rentals are tracked in spreadsheets and on paper. It is easy to promise one machine to two customers or hand over one that is under repair, and who owes what has to be worked out by hand. A heavyweight ERP is too expensive and too slow to roll out for this.
overview:
  ru: ТехРент заменяет таблицы простым веб-сервисом для менеджеров. Система сама проверяет, свободна ли техника на нужные даты, считает стоимость аренды по ставкам, следит за оплатой и показывает должников. Администратор приглашает менеджеров по ссылке и выдаёт им права по разделам, а каждое изменение попадает в журнал.
  en: TechRent replaces spreadsheets with a simple web service for managers. The system checks whether equipment is free on the requested dates, calculates the rental price from the rates, tracks payments and shows who owes money. The administrator invites managers by link and grants them per-module permissions, and every change goes into an audit log.
purpose:
  ru: Дипломный проект. Готовую систему я передал на обзор компании с собственным парком техники и получил обратную связь от её руководителя. Я вёл его как аналитик и архитектор — требования, модель данных, API, ролевая модель, — а код писал в Claude Code пошагово, с проверкой каждого шага. Отдельно разобрал главную фичу, бронирование, сквозным кейсом и принял реализацию по коду — так нашлись 11 расхождений с требованиями.
  en: A graduation project. I handed the finished system to a company with its own equipment fleet for review and got feedback from its head. I ran it as the analyst and architect — requirements, data model, API, role model — and wrote the code with Claude Code step by step, reviewing every step. I documented the key feature, booking, as an end-to-end case and accepted the implementation against the code, which surfaced 11 mismatches with the requirements.
goals:
  - { ru: "Не допустить двойного бронирования и аренды неисправной техники", en: "Prevent double booking and renting out broken equipment" }
  - { ru: "Видеть занятость всего парка на месяц за одну минуту", en: "See the whole fleet's availability for a month in a minute" }
  - { ru: "Считать стоимость и долги без ручных расчётов", en: "Calculate prices and debts without manual maths" }
  - { ru: "Давать менеджерам ровно те права, которые им нужны", en: "Give managers exactly the permissions they need" }
features:
  - { ru: "Каталог техники: ставки за день и час, статусы, фото, периоды обслуживания", en: "Equipment catalogue: daily and hourly rates, statuses, photos, maintenance periods" }
  - { ru: "Клиенты (юрлица и физлица) и их объекты-стройплощадки", en: "Customers (companies and individuals) and their construction sites" }
  - { ru: "Бронирование с проверкой доступности и расчётом стоимости", en: "Booking with availability checks and price calculation" }
  - { ru: "Календарь занятости — диаграмма Ганта «техника × дни»", en: "Availability calendar — a Gantt chart of equipment × days" }
  - { ru: "Платежи с частичной оплатой и защитой от переплаты", en: "Payments with partial payment and overpayment protection" }
  - { ru: "Финансовая сводка за период и список должников", en: "Financial summary for a period and a list of debtors" }
  - { ru: "Приглашение менеджеров по ссылке и права по модулям", en: "Manager invitations by link and per-module permissions" }
  - { ru: "Журнал действий: кто, что и когда изменил, данные до и после", en: "Audit log: who changed what and when, with before and after data" }
requirements:
  - { id: FR-01, type: FR, priority: Must, text: { ru: "Одна техника не может быть занята двумя неотменёнными заказами на пересекающиеся даты — даже при одновременных запросах.", en: "One piece of equipment cannot have two active orders with overlapping dates — even under concurrent requests." } }
  - { id: FR-02, type: FR, priority: Must, text: { ru: "Сломанную технику забронировать нельзя (422), технику на обслуживании — в его даты (409).", en: "Broken equipment cannot be booked (422); equipment under maintenance cannot be booked for those dates (409)." } }
  - { id: FR-03, type: FR, priority: Must, text: { ru: "Стоимость: несколько дней — ставка за день × дни включительно, один день — ставка за час × часы.", en: "Price: several days — daily rate × days inclusive; a single day — hourly rate × hours." } }
  - { id: FR-04, type: FR, priority: Must, text: { ru: "Сумма платежей по заказу не может превысить сумму заказа.", en: "Payments on an order cannot exceed the order total." } }
  - { id: FR-05, type: FR, priority: Must, text: { ru: "Номер заказа ТР-год-NNN уникален и не повторяется после удаления заказа.", en: "The order number ТР-year-NNN is unique and never reused after an order is deleted." } }
  - { id: FR-06, type: FR, priority: Should, text: { ru: "Менеджер видит и меняет только разделы, открытые ему администратором.", en: "A manager sees and changes only the modules the administrator opened to them." } }
  - { id: NFR-01, type: NFR, priority: Must, text: { ru: "Целостность на уровне БД: CHECK, UNIQUE, внешние ключи и ограничение EXCLUDE.", en: "Integrity at the database level: CHECK, UNIQUE, foreign keys and an EXCLUDE constraint." } }
  - { id: NFR-02, type: NFR, priority: Must, text: { ru: "Каждое создание, изменение и удаление пишется в журнал; сбой журнала не отменяет операцию.", en: "Every create, update and delete is logged; a logging failure does not roll back the operation." } }
  - { id: NFR-03, type: NFR, priority: Should, text: { ru: "Вся система поднимается одной командой docker compose up.", en: "The whole system starts with a single docker compose up." } }
scenarios:
  - title: { ru: "Бронирование техники", en: "Booking equipment" }
    actor: { ru: "Менеджер", en: "Manager" }
    steps:
      - { ru: "Находит свободную технику в календаре и отмечает даты", en: "Finds free equipment in the calendar and marks the dates" }
      - { ru: "Форма подставляет ставки и считает сумму, менеджер выбирает клиента и объект", en: "The form fills in the rates and calculates the total; the manager picks the customer and site" }
      - { ru: "Сервер в одной транзакции проверяет поломку, обслуживание и занятость", en: "In one transaction the server checks breakdowns, maintenance and overlaps" }
      - { ru: "Заказ получает номер ТР-2026-015, событие попадает в журнал", en: "The order gets number ТР-2026-015 and the event goes into the audit log" }
  - title: { ru: "Приглашение менеджера", en: "Inviting a manager" }
    actor: { ru: "Администратор", en: "Administrator" }
    steps:
      - { ru: "Создаёт менеджера и отмечает разделы и действия, которые ему доступны", en: "Creates a manager and ticks the modules and actions they may use" }
      - { ru: "Получает одноразовую ссылку на 7 дней и передаёт её", en: "Gets a one-time link valid for 7 days and passes it on" }
      - { ru: "Менеджер сам задаёт пароль — администратор его не видит", en: "The manager sets their own password — the administrator never sees it" }
      - { ru: "Права попадают в токен при входе, меню показывает только разрешённое", en: "Permissions go into the token at sign-in; the menu shows only what is allowed" }
stages:
  - period: { ru: "Шаги 1–3", en: "Steps 1–3" }
    title: { ru: "Основа", en: "Foundation" }
    text: { ru: "Docker Compose, Go API на Chi, миграции, встроенные в бинарник, JWT и роли.", en: "Docker Compose, a Go API on Chi, migrations embedded in the binary, JWT and roles." }
  - period: { ru: "Шаги 4–7", en: "Steps 4–7" }
    title: { ru: "Учёт", en: "Core records" }
    text: { ru: "Каталог техники, клиенты и объекты, заказы с расчётом стоимости, платежи.", en: "Equipment catalogue, customers and sites, orders with pricing, payments." }
  - period: { ru: "Шаги 8–11", en: "Steps 8–11" }
    title: { ru: "Контроль", en: "Control" }
    text: { ru: "Журнал действий, календарь Ганта, обслуживание техники, статусы заказов по датам.", en: "Audit log, Gantt calendar, equipment maintenance, date-derived order statuses." }
  - period: { ru: "Шаги 12–14", en: "Steps 12–14" }
    title: { ru: "Персонал и финансы", en: "Staff and finance" }
    text: { ru: "Панели деталей, приглашения и права менеджеров, финансовая сводка и должники.", en: "Detail panels, manager invitations and permissions, financial summary and debtors." }
  - period: { ru: "Приёмка", en: "Acceptance" }
    title: { ru: "Кейс и обратная связь", en: "Case and feedback" }
    text: { ru: "Сквозной кейс «Бронирование», 11 замечаний по коду и отзыву компании; исправлены все три высоких и повтор номеров.", en: "The end-to-end booking case, 11 findings from the code and the company's feedback; all three high-severity ones and repeated numbers fixed." }
  - period: { ru: "Далее", en: "Next" }
    title: { ru: "Уведомления и документы", en: "Notifications and documents" }
    text: { ru: "Уведомления в Telegram, договор, счёт и акт в PDF, аналитика загрузки парка.", en: "Telegram notifications, contract, invoice and certificate in PDF, fleet utilisation analytics." }
challenges:
  - title: { ru: "Двойное бронирование при одновременных запросах", en: "Double booking under concurrent requests" }
    text: { ru: "Проверка и запись шли отдельными запросами. Теперь — одна транзакция с блокировкой строки техники, а в БД ограничение EXCLUDE: из 10 одновременных запросов проходит один, остальные получают 409.", en: "The check and the write were separate queries. Now it is one transaction that locks the equipment row, plus an EXCLUDE constraint in the database: of 10 concurrent requests one succeeds and the rest get 409." }
  - title: { ru: "В форме была видна только часть техники", en: "The form showed only part of the fleet" }
    text: { ru: "Компания с 24 машинами при обзоре не нашла нужную: сервер молча обрезал список до 20. Явная ошибка 400 вместо подмены и поле выбора с серверным поиском.", en: "A reviewing company with 24 machines could not find one: the server silently cut the list to 20. An explicit 400 instead of the silent clamp and a picker with server-side search." }
  - title: { ru: "Номер заказа мог повториться", en: "Order numbers could repeat" }
    text: { ru: "COUNT + 1 выдавал занятый номер после удаления заказа. Таблица-счётчик по годам: номер выдаётся в транзакции заказа, не повторяется и не оставляет пропусков.", en: "COUNT + 1 handed out a taken number after a deletion. A per-year counter table: the number is issued inside the order transaction, never repeats and leaves no gaps." }
  - title: { ru: "Статус заказа зависит от сегодняшней даты", en: "Order status depends on today's date" }
    text: { ru: "В БД хранятся только «запланирован» и «отменён», а «активен» и «завершён» вычисляются в SQL при чтении — без ночных задач и рассинхронизации.", en: "The database stores only planned and cancelled; active and completed are computed in SQL on read — no nightly jobs and no drift." }
results:
  text:
    ru: Работающая CRM из 14 шагов — около 5,5 тысячи строк Go и 6,5 тысячи строк TypeScript, — с обратной связью от реальной компании. Сквозной кейс бронирования, OpenAPI, BPMN и словарь данных; из 11 замечаний аналитика исправлены все три высоких и повтор номеров, гонки проверены одновременными запросами.
    en: A working CRM built in 14 steps — about 5,500 lines of Go and 6,500 lines of TypeScript — reviewed by a real company. An end-to-end booking case, OpenAPI, BPMN and a data dictionary; of 11 analyst findings all three high-severity ones and repeated numbers are fixed, and the races are verified with concurrent requests.
  state:
    ru: Дальше — права на изменение и отмену заказа на сервере, уведомления в Telegram и документы в PDF.
    en: Next — server-side checks for order edit and cancel permissions, Telegram notifications and PDF documents.

architecture:
  diagram: d-tr-components
  text:
    ru: Три контейнера в Docker Compose. Nginx раздаёт React-приложение и проксирует /api на Go-сервис. Внутри сервиса — слои handler → service → repository, связанные через интерфейсы. Бизнес-правила живут в сервисе, а инварианты, которые нельзя нарушить ни одним путём записи, держит PostgreSQL.
    en: Three containers in Docker Compose. Nginx serves the React app and proxies /api to the Go service. Inside the service there are handler → service → repository layers wired through interfaces. Business rules live in the service, while invariants that no write path may break are enforced by PostgreSQL.
  flows: [d-booking-flow, d-booking-seq]
dataModel:
  diagram: d-tr-erd
  text:
    ru: Заказ ссылается на клиента, объект, технику и менеджера через внешние ключи с ON DELETE SET NULL — история заказов переживает удаление справочников. Ставки копируются в заказ, поэтому смена ставок техники не меняет оформленные суммы.
    en: An order references the customer, site, equipment and manager through foreign keys with ON DELETE SET NULL, so order history survives deletions from reference tables. Rates are copied into the order, so changing an equipment rate does not alter existing totals.
api:
  endpoints:
    - { method: GET, path: '/api/v1/calendar?from&to', text: { ru: "Занятость техники за период, сгруппированная по машинам", en: "Equipment availability for a period, grouped by machine" } }
    - { method: POST, path: /api/v1/orders, text: { ru: "Забронировать технику: 201, 400, 409 (занята, обслуживание), 422 (сломана)", en: "Book equipment: 201, 400, 409 (taken, maintenance), 422 (broken)" } }
    - { method: PUT, path: '/api/v1/orders/{id}', text: { ru: "Изменить заказ; сам заказ из проверки конфликтов исключается", en: "Update an order; the order itself is excluded from the conflict check" } }
    - { method: PATCH, path: '/api/v1/orders/{id}/status', text: { ru: "Отменить заказ — принимается только cancelled", en: "Cancel an order — only cancelled is accepted" } }
    - { method: POST, path: /api/v1/payments, text: { ru: "Принять платёж; переплата — 422 внутри той же транзакции", en: "Record a payment; overpayment is a 422 inside the same transaction" } }
    - { method: GET, path: '/api/v1/finance/summary?period', text: { ru: "Сводка за месяц, квартал или год и текущие долги клиентов", en: "Summary for a month, quarter or year plus current customer debts" } }
    - { method: POST, path: /api/v1/users, text: { ru: "Пригласить менеджера: ссылка на 7 дней и права по модулям", en: "Invite a manager: a 7-day link and per-module permissions" } }
    - { method: GET, path: /api/v1/audit, text: { ru: "Журнал действий с данными до и после (только администратор)", en: "Audit log with before and after data (administrator only)" } }
  integrations:
    - name: Nginx → Go API
      protocol: HTTP · REST JSON
      text: { ru: "Nginx раздаёт сборку React и проксирует /api и /uploads на сервис.", en: "Nginx serves the React build and proxies /api and /uploads to the service." }
    - name: JWT
      protocol: Bearer
      text: { ru: "Access-токен на 1 час и refresh на 7 дней; права менеджера лежат в токене.", en: "A 1-hour access token and a 7-day refresh token; manager permissions live in the token." }
    - name: { ru: "Telegram (планируется)", en: "Telegram (planned)" }
      protocol: Bot API
      text: { ru: "Уведомления о создании и отмене заказа; поле telegram_chat_id уже есть.", en: "Notifications on order creation and cancellation; the telegram_chat_id field already exists." }
decisions:
  - title: { ru: "Статусы заказа вычисляются по датам", en: "Order statuses are derived from dates" }
    choice: { ru: "В БД только planned и cancelled, остальное — CASE WHEN в каждом SELECT.", en: "The database stores only planned and cancelled; the rest is a CASE WHEN in every SELECT." }
    why: { ru: "Статус всегда актуален в момент чтения, не нужна фоновая задача, которая может упасть.", en: "The status is always current at read time, with no background job that could fail." }
    alternatives: { ru: "Хранить все статусы и обновлять их ночным заданием.", en: "Store every status and update them with a nightly job." }
  - title: { ru: "Блокировка строки техники плюс EXCLUDE", en: "Equipment row lock plus EXCLUDE" }
    choice: { ru: "SELECT … FOR UPDATE на технике в транзакции заказа и ограничение-исключение по диапазону дат.", en: "SELECT … FOR UPDATE on the equipment row inside the order transaction, and an exclusion constraint on the date range." }
    why: { ru: "Блокировка даёт понятный 409 и сериализует бронь и обслуживание; EXCLUDE страхует любой путь записи.", en: "The lock yields a clear 409 and serialises booking and maintenance; EXCLUDE guards every write path." }
    alternatives: { ru: "Только проверка в коде — пропускает гонки.", en: "A check in code only — lets races through." }
  - title: { ru: "Права менеджера в JWT", en: "Manager permissions in the JWT" }
    pros:
      - { ru: "Нет запроса к БД на каждый запрос", en: "No database query per request" }
      - { ru: "Сервис остаётся stateless", en: "The service stays stateless" }
    cons:
      - { ru: "Изменённые права действуют после следующего входа — до часа", en: "Changed permissions apply after the next sign-in — up to an hour" }
  - title: { ru: "Инвайт-ссылка вместо временного пароля", en: "Invite link instead of a temporary password" }
    choice: { ru: "32-байтный токен из crypto/rand на 7 дней; пароль менеджер задаёт сам.", en: "A 32-byte token from crypto/rand valid for 7 days; the manager sets the password." }
    why: { ru: "Пароль не передаётся в мессенджерах, и администратор его не знает.", en: "The password is never sent over messengers and the administrator never knows it." }
  - title: { ru: "Таблица-счётчик номеров", en: "A counter table for numbers" }
    choice: { ru: "order_counters по годам, upsert внутри транзакции заказа.", en: "order_counters per year, upserted inside the order transaction." }
    why: { ru: "MAX + 1 повторяет номер удалённого заказа, SEQUENCE оставляет пропуски — для договоров и счетов недопустимо и то и другое.", en: "MAX + 1 reuses a deleted order's number and a SEQUENCE leaves gaps — neither is acceptable for contracts and invoices." }

