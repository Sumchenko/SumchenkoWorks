      nginx: { ru: "Раздаёт сборку, отдаёт index.html на любой маршрут SPA, проксирует /api и /uploads.", en: "Serves the build, returns index.html for any SPA route, proxies /api and /uploads." }
      api: { ru: "Go 1.24: handler → service → repository через интерфейсы. Миграции встроены в бинарник и запускаются при старте.", en: "Go 1.24: handler → service → repository through interfaces. Migrations are embedded in the binary and run on start." }
      pg: { ru: "PostgreSQL 16: ограничение EXCLUDE от двойной брони, CHECK на суммы и даты, счётчик номеров.", en: "PostgreSQL 16: an EXCLUDE constraint against double booking, CHECKs on amounts and dates, a number counter." }
      files: { ru: "Том Docker с фотографиями техники.", en: "A Docker volume with equipment photos." }
      tg: { ru: "Уведомления о заказах — следующий шаг, поле для chat_id уже в схеме.", en: "Order notifications are the next step; the chat_id field is already in the schema." }
  - id: d-booking-flow
    kind: flow
    title: { ru: "Бронирование техники", en: "Booking equipment" }
    steps:
      - { lane: { ru: "МЕНЕДЖЕР", en: "MANAGER" }, title: { ru: "Найти свободную технику", en: "Find free equipment" }, text: { ru: "Календарь показывает заказы и обслуживание; сломанной техники в нём нет.", en: "The calendar shows orders and maintenance; broken equipment is hidden." } }
      - { lane: { ru: "МЕНЕДЖЕР", en: "MANAGER" }, title: { ru: "Заполнить заказ", en: "Fill in the order" }, text: { ru: "Ставки подставляются из техники, сумма считается сама, клиент и объект — из базы.", en: "Rates come from the equipment, the total is calculated, customer and site come from the database." } }
      - { lane: { ru: "СИСТЕМА", en: "SYSTEM" }, title: { ru: "Проверить даты", en: "Check the dates" }, text: { ru: "Формат YYYY-MM-DD и конец не раньше начала, иначе 400.", en: "Format YYYY-MM-DD and end not before start, otherwise 400." } }
      - { lane: { ru: "СИСТЕМА", en: "SYSTEM" }, title: { ru: "Проверить доступность", en: "Check availability" }, text: { ru: "Сломана — 422; обслуживание или занята на эти даты — 409.", en: "Broken — 422; maintenance or already booked for these dates — 409." } }
      - { lane: { ru: "СИСТЕМА", en: "SYSTEM" }, title: { ru: "Сохранить", en: "Save" }, text: { ru: "Номер ТР-год-NNN, статус «Запланирован», запись в журнал.", en: "Number ТР-year-NNN, status Planned, an audit log entry." } }
      - { lane: { ru: "МЕНЕДЖЕР", en: "MANAGER" }, title: { ru: "Подтвердить клиенту", en: "Confirm to the customer" }, text: { ru: "Сообщает номер заказа и даты; при отказе подбирает другие даты или технику.", en: "Passes on the order number and dates; on refusal picks other dates or equipment." } }
  - id: d-booking-seq
    kind: flow
    title: { ru: "Запрос POST /orders через слои", en: "POST /orders through the layers" }
    steps:
      - { lane: MIDDLEWARE, title: { ru: "Проверить токен", en: "Check the token" }, text: { ru: "Подпись и срок JWT, id, роль и права кладутся в context. Нет токена — 401.", en: "JWT signature and expiry; id, role and permissions go into the context. No token — 401." } }
      - { lane: SERVICE, title: { ru: "Разобрать даты", en: "Parse the dates" }, text: { ru: "Строго time.DateOnly до любых проверок.", en: "Strictly time.DateOnly before any checks." } }
      - { lane: REPOSITORY, title: { ru: "Заблокировать технику", en: "Lock the equipment" }, text: { ru: "BEGIN; SELECT статус и обслуживание … FOR UPDATE — запросы на одну машину встают в очередь.", en: "BEGIN; SELECT status and maintenance … FOR UPDATE — requests for one machine queue up." } }
      - { lane: SERVICE, title: { ru: "Проверить доступность", en: "Check availability" }, text: { ru: "Поломка, обслуживание, пересечение с неотменёнными заказами.", en: "Breakdown, maintenance, overlap with active orders." } }
      - { lane: POSTGRES, title: { ru: "Номер и запись", en: "Number and insert" }, text: { ru: "Upsert в order_counters, INSERT … RETURNING с вычисленным статусом. EXCLUDE — последняя страховка.", en: "Upsert into order_counters, INSERT … RETURNING with the computed status. EXCLUDE is the last safeguard." } }
      - { lane: HANDLER, title: { ru: "Ответ и журнал", en: "Response and audit" }, text: { ru: "COMMIT, 201 с заказом; событие CREATE в журнал, его сбой ответ не меняет.", en: "COMMIT, 201 with the order; a CREATE event in the log, whose failure does not change the response." } }
  - id: d-tr-erd
    kind: erd
    title: { ru: "Модель данных", en: "Data model" }
    entities:
      - { id: users, name: USERS, fields: [[id, uuid, PK], [email, varchar, UK], [role, 'admin|manager'], [permissions, jsonb], [status, 'active|pending'], [invite_token, varchar, UK]] }
      - { id: equipment, name: EQUIPMENT, fields: [[id, uuid, PK], [name, varchar], [category, varchar], [status, enum], [daily_rate, numeric], [hourly_rate, numeric], [maintenance_from, date], [maintenance_to, date]] }
      - { id: photos, name: EQUIPMENT_PHOTOS, fields: [[id, uuid, PK], [equipment_id, uuid, FK], [url, varchar], [is_primary, bool]] }
      - { id: clients, name: CLIENTS, fields: [[id, uuid, PK], [type, 'legal|individual'], [name, varchar], [inn, varchar], [phone, varchar]] }
      - { id: objects, name: OBJECTS, fields: [[id, uuid, PK], [client_id, uuid, FK], [name, varchar], [address, text], [is_active, bool]] }
      - { id: orders, name: ORDERS, fields: [[id, uuid, PK], [number, varchar, UK], [equipment_id, uuid, FK], [client_id, uuid, FK], [object_id, uuid, FK], [manager_id, uuid, FK], [status, 'planned|cancelled'], [start_date, date], [end_date, date], [total_amount, numeric], [paid_amount, numeric], [payment_status, enum]] }
      - { id: payments, name: PAYMENTS, fields: [[id, uuid, PK], [order_id, uuid, FK], [amount, numeric], [method, enum], [created_by, uuid, FK]] }
      - { id: audit, name: AUDIT_LOG, fields: [[id, bigserial, PK], [user_id, uuid, FK], [action, varchar], [entity_type, varchar], [old_data, jsonb], [new_data, jsonb]] }
    relations: [[equipment, photos, '1 : N'], [equipment, orders, '1 : N'], [clients, objects, '1 : N'], [clients, orders, '1 : N'], [objects, orders, '1 : N'], [users, orders, '1 : N'], [orders, payments, '1 : N'], [users, payments, '1 : N'], [users, audit, '1 : N']]
  - id: d-tr-booking-erd
    kind: erd
    title: { ru: "Таблицы бронирования", en: "Booking tables" }
    entities:
      - { id: equipment, name: EQUIPMENT, fields: [[id, uuid, PK], [status, enum], [maintenance_from, date], [maintenance_to, date]] }
      - { id: orders, name: ORDERS, fields: [[id, uuid, PK], [number, varchar, UK], [equipment_id, uuid, FK], [status, 'planned|cancelled'], [start_date, date], [end_date, date], [daily_rate, numeric], [hourly_rate, numeric], [hours, int], [total_amount, numeric]] }
      - { id: counters, name: ORDER_COUNTERS, fields: [[year, int, PK], [last_value, int]] }
      - { id: audit, name: AUDIT_LOG, fields: [[id, bigserial, PK], [entity_id, varchar], [action, varchar], [old_data, jsonb], [new_data, jsonb]] }
    relations: [[equipment, orders, '1 : N'], [orders, audit, '1 : N']]

