# Mito — источник: репозиторий github.com/Sumchenko/Mito (README, docs/ROADMAP.md, docs/DEPLOY.md, sa-docs/, код).
code: P—01
order: 1
demo: false
featured: true
title: Mito
summary:
  ru: Задачи, таймер, календарь с семантическим зумом и AI-ментор в одном local-first приложении.
  en: Tasks, a timer, a semantic-zoom calendar and an AI mentor in one local-first app.
category: dev
status: live
year: 2026
period: 2026.09 → …
role:
  ru: Аналитика, архитектура, разработка в Claude Code
  en: Analysis, architecture, development with Claude Code
