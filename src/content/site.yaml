# Схема «Подход к разработке» на главной: ровно 6 этапов, порядок совпадает с анимацией.
lifecycle:
  title: { ru: "Один цикл создания продукта", en: "One product cycle" }
  text:
    ru: Идея проходит системный анализ и проектирование, реализуется с AI-инструментами под инженерным контролем, проверяется автотестами и становится работающим продуктом. Данные эксплуатации запускают следующий цикл.
    en: An idea goes through systems analysis and design, is implemented with AI tools under engineering control, is verified by automated tests and becomes a working product. Production data starts the next cycle.
  stages:
    - code: IDEA
      short: IDEA
      name: { ru: "Идея", en: "Idea" }
      text:
        ru: Исходная идея фиксируется как цель продукта, требования и основные пользовательские сценарии.
        en: The initial idea is captured as a product goal, requirements and the main user scenarios.
      input: { ru: "Запрос, проблема, гипотеза", en: "Request, problem, hypothesis" }
      output: { ru: "Цель, требования, сценарии", en: "Goal, requirements, scenarios" }
    - code: ANALYSIS
      short: ANALYSIS
      name: { ru: "Системный анализ", en: "Systems analysis" }
      text:
        ru: Требования связываются с сущностями и процессами. Появляется модель предметной области и границы системы.
        en: Requirements are linked to entities and processes. A domain model and system boundaries emerge.
      input: { ru: "Цель, требования, сценарии", en: "Goal, requirements, scenarios" }
      output: { ru: "Модель данных, процессы, границы", en: "Data model, processes, boundaries" }
    - code: ARCHITECTURE
      short: ARCHITECTURE
      name: { ru: "Архитектура", en: "Architecture" }
      text:
        ru: Из модели строится архитектура — интерфейс, API, бизнес-логика, база данных и внешние интеграции. Определяются контракты и потоки данных.
        en: The model turns into an architecture — UI, API, business logic, database and external integrations. Contracts and data flows are defined.
      input: { ru: "Модель данных и процессов", en: "Data and process model" }
      output: { ru: "C4-схема, контракты API, ADR", en: "C4 diagram, API contracts, ADRs" }
    - code: AI-ASSISTED DEV
      short: AI-DEV
      name: { ru: "Разработка с AI", en: "AI-assisted development" }
      text:
        ru: Задачи из архитектуры реализуются с AI-инструментами. Черновик кода появляется быстрее, но каждое решение проходит инженерное ревью и встраивается в архитектуру.
        en: Tasks from the architecture are implemented with AI tools. Draft code appears faster, but every decision goes through engineering review and fits into the architecture.
      input: { ru: "Задачи, контракты, ADR", en: "Tasks, contracts, ADRs" }
      output: { ru: "Модули после ревью", en: "Reviewed modules" }
    - code: TESTING & AUTOMATION
      short: TESTING
      name: { ru: "Тесты и автоматизация", en: "Testing and automation" }
      text:
        ru: Автотесты, проверка контрактов и контроль качества в CI. Модуль, не прошедший проверку, возвращается на доработку и проверяется снова.
        en: Automated tests, contract checks and quality gates in CI. A module that fails goes back for rework and is checked again.
      input: { ru: "Модули приложения", en: "Application modules" }
      output: { ru: "Проверенная сборка, отчёт", en: "Verified build, report" }
    - code: WORKING PRODUCT
      short: PRODUCT
      name: { ru: "Работающий продукт", en: "Working product" }
      text:
        ru: Модули собираются в продукт, связанный с API, базой данных и интеграциями. Данные эксплуатации становятся входом следующего цикла.
        en: Modules come together into a product connected to the API, database and integrations. Production data becomes the input of the next cycle.
      input: { ru: "Проверенная сборка", en: "Verified build" }
      output: { ru: "Релиз, метрики, обратная связь", en: "Release, metrics, feedback" }
