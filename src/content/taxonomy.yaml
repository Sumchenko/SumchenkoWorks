# Справочники: категории, статусы, технологии и типы артефактов.
# Проекты ссылаются на них по id. Новую технологию сначала добавьте сюда.

categories:
  - id: dev
    label: { ru: "Разработка", en: "Development" }
    text:
      ru: Веб-сервисы, API и внутренние инструменты — от прототипа до продакшена.
      en: Web services, APIs and internal tools — from prototype to production.
  - id: sa
    label: { ru: "Системный анализ", en: "Systems analysis" }
    text:
      ru: Требования, процессы, модели данных и контракты интеграций.
      en: Requirements, processes, data models and integration contracts.
  - id: arch
    label: { ru: "Проектирование", en: "Solution design" }
    text:
      ru: Архитектура программных решений и документация, по которой можно строить.
      en: Software architecture and documentation you can actually build from.

# Вид бейджа задаётся в коде: live и done — контур, wip — мигающая точка, concept — пунктир, archive — серый.
